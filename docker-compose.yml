services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: openclaw-sentinel-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./ops/searxng:/etc/searxng
    restart: unless-stopped

  chroma:
    image: docker.io/chromadb/chroma:latest
    container_name: openclaw-sentinel-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./workspace-data/chroma:/chroma/chroma
    restart: unless-stopped
